<title>SCAE Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: aplicativo de gestão. Menu lateral azul-marinho quase preto, área de trabalho clara (ou preta no tema escuro). */
:root{
  --navy-950:#050A16; --navy-900:#081429; --navy-800:#0B1F44; --navy-700:#0F2C63; --navy-600:#16408C;
  --brand:#1A4FB8; --brand-ink:#FFFFFF; --brand-soft:#E6EDFB; --brand-line:#BFD0F2;
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#DCE2EC; --line-2:#E9EDF4;
  --ink:#0B1220; --ink-2:#3A465C; --ink-3:#6A768C;
  --ok:#137A4B; --ok-soft:#E3F4EB; --warn:#9A5B00; --warn-soft:#FDF1DC; --bad:#B42318; --bad-soft:#FCE8E6;
  --side-bg:#071229; --side-ink:#C9D4EA; --side-ink-2:#8794B0; --side-act:#12295A; --side-line:#14244A;
  --shadow:0 1px 2px rgba(8,20,41,.06),0 8px 24px rgba(8,20,41,.06);
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Space Grotesk','Inter',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#3C7BFF; --brand-ink:#FFFFFF; --brand-soft:#0F1E3F; --brand-line:#1E3A75;
  --bg:#03060D; --surface:#0A1120; --surface-2:#0D1628; --line:#1A2640; --line-2:#141E33;
  --ink:#E8EDF7; --ink-2:#AEB9CF; --ink-3:#7C89A3;
  --ok:#3CCB86; --ok-soft:#0B2A1D; --warn:#F2B14C; --warn-soft:#2E2208; --bad:#FF7A6E; --bad-soft:#331210;
  --side-bg:#02050C; --side-ink:#C9D4EA; --side-ink-2:#7783A0; --side-act:#0E1F45; --side-line:#0F1A33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#3C7BFF; --brand-ink:#FFFFFF; --brand-soft:#0F1E3F; --brand-line:#1E3A75;
  --bg:#03060D; --surface:#0A1120; --surface-2:#0D1628; --line:#1A2640; --line-2:#141E33;
  --ink:#E8EDF7; --ink-2:#AEB9CF; --ink-3:#7C89A3;
  --ok:#3CCB86; --ok-soft:#0B2A1D; --warn:#F2B14C; --warn-soft:#2E2208; --bad:#FF7A6E; --bad-soft:#331210;
  --side-bg:#02050C; --side-ink:#C9D4EA; --side-ink-2:#7783A0; --side-act:#0E1F45; --side-line:#0F1A33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);letter-spacing:-.01em;text-wrap:balance;margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-ui)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- marca SCAE ---------- */
.marca{display:flex;align-items:center;gap:12px}
.marca svg{flex:none}
.marca .wm{display:flex;flex-direction:column;line-height:1}
.marca .wm b{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;font-size:22px}
.marca .wm small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;opacity:.75}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.login-arte{background:radial-gradient(120% 90% at 0% 0%,#123476 0%,#0A1A3D 45%,#030712 100%);color:#E8EEFA;padding-block:48px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-arte .grade{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000 10%,transparent 85%)}
.login-arte > *{position:relative}
.login-arte h1{font-size:clamp(28px,3.4vw,42px);line-height:1.08;max-width:15ch;font-weight:600}
.login-arte p{color:#A9B7D6;max-width:46ch;font-size:15px}
.login-arte ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;color:#C8D3EA;font-size:13.5px}
.login-arte li{display:flex;gap:10px;align-items:center}
.login-arte li svg{color:#6E9BFF}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface)}
.login-card{width:100%;max-width:380px;display:grid;gap:18px}
.login-card h2{font-size:24px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;height:46px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:600}
.btn-google:hover{border-color:var(--brand-line);background:var(--surface-2)}
.contas{display:grid;gap:8px}
.conta{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.conta:hover{border-color:var(--brand);background:var(--brand-soft)}
.conta .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--navy-800);color:#fff;font-weight:600;font-size:13px;flex:none}
.conta div{min-width:0}
.conta b{display:block;font-weight:600}
.conta small{color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aviso-prot{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:14px}

/* ---------- casca ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--side-line)}
.side-emp{padding:18px 16px 14px;border-bottom:1px solid var(--side-line);display:grid;gap:10px}
.logo-emp{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:9px;padding:8px 10px;height:62px}
.logo-emp img{max-height:46px;max-width:100%;object-fit:contain}
.mono-emp{display:flex;align-items:center;gap:10px}
.mono-emp .ini{width:40px;height:40px;border-radius:9px;background:linear-gradient(160deg,#1C4DB0,#0B1F44);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.04em;flex:none}
.side-emp .nome{font-weight:600;color:#fff;font-size:13.5px;line-height:1.25}
.side-emp .sub{font-size:11.5px;color:var(--side-ink-2)}
.troca-emp{font-size:12px;color:#8FB0FF;background:none;border:0;padding:0;cursor:pointer;text-align:left}
nav.menu{flex:1;overflow:auto;padding:10px 10px;display:grid;align-content:start;gap:2px}
.menu .rot{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink-2);padding:14px 10px 6px}
.menu a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:13.5px}
.menu a:hover{background:rgba(255,255,255,.04);color:#fff}
.menu a.on{background:var(--side-act);color:#fff;box-shadow:inset 2px 0 0 #4D86FF}
.menu a svg{width:18px;height:18px;flex:none;opacity:.9}
.menu a .cont{margin-left:auto;font-size:11px;background:#8A2A1F;color:#fff;border-radius:99px;padding:1px 7px}
.side-pe{border-top:1px solid var(--side-line);padding:12px 14px;display:grid;gap:10px}
.side-pe .marca svg{width:24px;height:24px}
.side-pe .marca .wm b{font-size:13px;color:#fff}
.side-pe .marca .wm small{font-size:9px;margin-top:3px;color:var(--side-ink-2);opacity:1}
.usuario{display:flex;align-items:center;gap:10px;font-size:12.5px}
.usuario .av{width:30px;height:30px;border-radius:50%;background:#1C3A78;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.usuario div{min-width:0;flex:1}
.usuario b{display:block;color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usuario small{color:var(--side-ink-2)}
.side-acoes{display:flex;gap:6px}
.side-acoes button{flex:1;height:32px;border-radius:7px;border:1px solid var(--side-line);background:transparent;color:var(--side-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px}
.side-acoes button svg{width:15px;height:15px;flex:none}
.side-acoes button:hover{background:rgba(255,255,255,.05)}

.main{min-width:0;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:14px;padding-block:18px 6px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topo h1{font-size:24px;font-weight:600}
.topo .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.topo .acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.topo-m{display:none}
.conteudo{padding-block:14px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--brand-line);background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.perigo{color:var(--bad);border-color:var(--line)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:600}
.card-h .muted{font-size:12.5px}
.card-h .dir{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.card-b{padding:16px}
.muted{color:var(--ink-3)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-painel{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:500}
.kpi .v{font-family:var(--f-disp);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--ink-3)}
.kpi.repor .v{color:var(--warn)}
.campo{display:grid;gap:5px;min-width:0}
.campo label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.campo .dica{font-size:12px;color:var(--ink-3)}
.inp,select.inp,textarea.inp{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 11px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:80px;padding:9px 11px;resize:vertical}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.inp.num{text-align:right}
.form{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}
.tabela-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tbody tr.clica{cursor:pointer}
.t tbody tr.clica:hover td{background:var(--surface-2)}
.t td .nome{font-weight:600}
.t td small{display:block;color:var(--ink-3);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.azul{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.chip svg{width:12px;height:12px}
.grupo-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.grupo-tag i{width:9px;height:9px;border-radius:3px;display:inline-block}
.barra-filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.barra-filtros .inp{width:auto;flex:1 1 200px}
.barra-filtros select.inp{flex:0 1 190px}
.vazio{padding:36px 16px;text-align:center;color:var(--ink-3);display:grid;gap:10px;justify-items:center}
.vazio svg{width:30px;height:30px;color:var(--ink-3)}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.abas button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--ink-3);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.abas button.on{color:var(--ink);border-bottom-color:var(--brand)}
.alerta{display:flex;gap:10px;padding:11px 13px;border-radius:8px;font-size:13px;align-items:flex-start}
.alerta svg{width:18px;height:18px;flex:none;margin-top:1px}
.alerta.info{background:var(--brand-soft);color:var(--ink)}
.alerta.info svg{color:var(--brand)}
.alerta.warn{background:var(--warn-soft);color:var(--ink)}
.alerta.warn svg{color:var(--warn)}
.alerta.ok{background:var(--ok-soft);color:var(--ink)}
.alerta.ok svg{color:var(--ok)}
.passos{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.passos span{display:flex;align-items:center;gap:6px}
.passos span b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:11px}
.passos span.on{color:var(--ink);font-weight:600}
.passos span.on b{background:var(--brand);color:#fff;border-color:var(--brand)}
.passos i{width:18px;height:1px;background:var(--line)}

/* barras do painel */
.barras{display:grid;gap:12px}
.barra{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.barra .trilho{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.barra .trilho i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.barra .v{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:76px;text-align:right}
.colunas{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px;border-bottom:1px solid var(--line)}
.colunas div{flex:1;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;position:relative;opacity:.85}
.colunas div:hover{opacity:1}
.colunas-eixo{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px}

/* lista de movimentos */
.mov{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.mov:last-child{border-bottom:0}
.mov:hover{background:var(--surface-2)}
.mov .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.mov .ic svg{width:17px;height:17px}
.mov .ic.ent{background:var(--ok-soft);color:var(--ok)}
.mov .ic.sai{background:var(--brand-soft);color:var(--brand)}
.mov .ic.aju{background:var(--warn-soft);color:var(--warn)}
.mov .ic.est{background:var(--bad-soft);color:var(--bad)}
.mov .tx{min-width:0;flex:1}
.mov .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .tx small{color:var(--ink-3);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .vl{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.mov .vl small{display:block;color:var(--ink-3);font-size:11.5px}

/* busca de produto */
.busca{position:relative}
.busca-res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);z-index:20;max-height:280px;overflow:auto}
.busca-res button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:9px 12px;border:0;background:none;cursor:pointer;border-bottom:1px solid var(--line-2)}
.busca-res button:hover,.busca-res button.on{background:var(--brand-soft)}
.busca-res button div{min-width:0;flex:1}
.busca-res b{font-weight:600;display:block}
.busca-res small{color:var(--ink-3);font-size:12px}

/* janela */
.fundo{position:fixed;inset:0;background:rgba(3,7,18,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:max(40px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.janela{background:var(--surface);border-radius:12px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;min-width:0}
.janela.larga{max-width:920px}
.janela-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.janela-h h2{font-size:17px;font-weight:600}
.janela-h .x{margin-left:auto}
.janela-b{padding:18px;display:grid;gap:16px;min-width:0}
.janela-p{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0B1220;color:#fff;padding:11px 16px;border-radius:9px;font-size:13.5px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* documento (comprovante, mapa) */
.doc{background:#fff;color:#0B1220;border:1px solid #D7DEEA;border-radius:6px;padding:28px 30px;display:grid;gap:18px;font-size:13px}
.doc-cab{display:flex;gap:18px;align-items:center;border-bottom:2px solid #0B1F44;padding-bottom:14px}
.doc-cab .lg{height:54px;max-width:190px;display:flex;align-items:center}
.doc-cab .lg img{max-height:54px;max-width:190px;object-fit:contain}
.doc-cab .lg .ini{width:54px;height:54px;border-radius:10px;background:#0B1F44;color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:18px}
.doc-cab .emp b{display:block;font-size:15px}
.doc-cab .emp small{color:#5B667A;display:block}
.doc-cab .id{margin-left:auto;text-align:right}

function simboloSCAE(t=40, variante='padrao'){

/* ---------- reconhecimento de itens (mesma regra do Almox) ---------- */
const ABREV = { CX:'CAIXA', PCT:'PACOTE', PC:'PECA', UND:'UN', UNID:'UN', BR:'BRANCO', BCO:'BRANCO', PT:'PRETO', AZ:'AZUL', LAMP:'LAMPADA', DESINF:'DESINFETANTE', DETERG:'DETERGENTE', LIMP:'LIMPADOR', SAB:'SABAO', PAP:'PAPEL', HIG:'HIGIENICO', TOAL:'TOALHA', VASS:'VASSOURA', LIX:'LIXO', PLAST:'PLASTICA', MULT:'MULTIUSO', FL:'FOLHA', FLS:'FOLHA', DUP:'DUPLA', GD:'GRANDE', LIQ:'LIQUIDO', CONC:'CONCENTRADO', INTERF:'INTERFOLHA', EMB:'EMBUTIR', TOM:'TOMADA', REG:'REGISTRO', TORN:'TORNEIRA' };
const STOP = new Set(['DE','DA','DO','DAS','DOS','E','COM','SEM','PARA','EM','X','A','O','UN','UNIDADE','CAIXA','PACOTE','PECA','C','P','S','NO','NA','TIPO','REF','ROLO','ROLOS','FD','FARDO']);
const stem = w => w.length >= 5 ? w.replace(/S$/, '').replace(/(A|O)$/, '') : w;
function parseDesc(s){
  let t = norm(s).replace(/\bC\//g,' COM ').replace(/\bS\//g,' SEM ');
  const sizes = new Set(), num = x => parseFloat(String(x).replace(',', '.'));
  const add = (v, u) => { if (isFinite(v) && v > 0) sizes.add('#' + (Math.round(v*100)/100) + u); return ' '; };
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*(ML|L|LT|LITROS?)\b/g, (m,v,u) => add(u === 'ML' ? num(v) : num(v)*1000, 'ML'));
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*(KG|G|GR)\b/g, (m,v,u) => add(u === 'KG' ? num(v)*1000 : num(v), 'G'));
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*(MM|CM|M)\b/g, (m,v,u) => add(u === 'MM' ? num(v) : u === 'CM' ? num(v)*10 : num(v)*1000, 'MM'));
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*(W|V|A)\b/g, (m,v,u) => add(num(v), u));
  const words = new Set(), nums = new Set();
  t.split(/[^A-Z0-9.]+/).forEach(w => { w = w.replace(/^\.+|\.+$/g,''); if (!w) return; if (/^\d+(\.\d+)?$/.test(w)){ nums.add(String(+w)); return; } w = w.replace(/\./g,''); const f = ABREV[w] || w; if (STOP.has(f) || f.length < 2) return; words.add(stem(f)); });
  return { words, sizes, nums };
}
function scoreDesc(a, b){
  const A = parseDesc(a), B = parseDesc(b);
  if (!A.words.size || !B.words.size) return 0;
  const match = (w, set) => { if (set.has(w)) return 1; if (w.length >= 4) for (const x of set) if (x.length >= 4 && (x.startsWith(w) || w.startsWith(x))) return .85; return 0; };
  let hit = 0; A.words.forEach(w => hit += match(w, B.words));
  let s = (2*hit) / (A.words.size + B.words.size) * 100;
  if (A.sizes.size && B.sizes.size){ s = [...A.sizes].some(x => B.sizes.has(x)) ? Math.min(100, s + 8) : Math.min(s, 45); }
  if (A.nums.size && B.nums.size && ![...A.nums].some(x => B.nums.has(x))) s -= 8;
  return Math.max(0, Math.min(100, Math.round(s)));
}
const descKey = s => { const d = parseDesc(s); return [...d.words].sort().join(' ') + '|' + [...d.sizes].sort().join(' '); };
function fatorDaDescricao(x){ const m = norm(x).match(/\b(?:C\/?|COM|CX|FD|PCT)\s*(\d{1,4})\b|\b(\d{1,4})\s*(?:UN|UND|ROLOS?|PCS?)\b/); const n = m ? +(m[1] || m[2]) : 0; return n > 1 && n <= 1000 ? n : 0; }
/* Ordem (igual ao Almox): código do fornecedor → EAN → nome já aprendido → nome parecido.
   Nome parecido: 90 ou mais liga sozinho; 60 a 89 é sugestão; abaixo disso vira produto novo. */
function reconhecer(E, it, fornId){
  const pool = E.produtos;
  if (fornId && it.cProd) for (const p of pool){ const v = (p.vinculos||[]).find(v => v.fornecedorId === fornId && v.cProd === it.cProd); if (v) return { tipo:'vinculo', produtoId:p.id, nota:100, fator:v.fator || 1, lembrada:true, cands:[] }; }
  if (validEAN(it.ean)){ const p = pool.find(p => p.ean && digits(p.ean) === digits(it.ean)); if (p) return { tipo:'ean', produtoId:p.id, nota:100, cands:[] }; }
  const nomesDe = p => [p.nome, ...(p.apelidos||[]), ...(p.vinculos||[]).map(v => v.xProd || '')].filter(Boolean);
  const k = descKey(it.xProd);
  if (k.replace(/\|/g,'').trim()){
    const ap = pool.find(p => nomesDe(p).some(a => descKey(a) === k));
    if (ap){ const v = (ap.vinculos||[]).find(v => v.fornecedorId === fornId); return { tipo:'apelido', produtoId:ap.id, nota:100, fator:v?.fator, lembrada:!!v, cands:[] }; }
  }
  const cands = pool.map(p => ({ p, n:Math.max(...nomesDe(p).map(a => scoreDesc(it.xProd, a))) })).filter(c => c.n >= 40).sort((a,b) => b.n - a.n).slice(0,3);
  if (cands[0] && cands[0].n >= 90) return { tipo:'nome', produtoId:cands[0].p.id, nota:cands[0].n, cands };
  if (cands[0] && cands[0].n >= 60) return { tipo:'sugestao', produtoId:cands[0].p.id, nota:cands[0].n, cands };
  return { tipo:'novo', produtoId:null, nota:cands[0]?.n || 0, cands };
}
const certo = m => m && m.tipo !== 'sugestao' && m.tipo !== 'novo';

/* ---------- códigos: EAN, CNPJ e chave de acesso ---------- */
function validEAN(e){ e = digits(e); if (![8,12,13,14].includes(e.length)) return false; const a = e.split('').map(Number); const dv = a.pop(); let s = 0; a.reverse().forEach((n,i) => s += n * (i % 2 === 0 ? 3 : 1)); return (10 - s % 10) % 10 === dv; }
function validCNPJ(c){ c = digits(c); if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false; const calc = n => { let s = 0, p = n - 7; for (let i = 0; i < n; i++){ s += +c[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; }; return calc(12) === +c[12] && calc(13) === +c[13]; }
const UF_COD = {11:'RO',12:'AC',13:'AM',14:'RR',15:'PA',16:'AP',17:'TO',21:'MA',22:'PI',23:'CE',24:'RN',25:'PB',26:'PE',27:'AL',28:'SE',29:'BA',31:'MG',32:'ES',33:'RJ',35:'SP',41:'PR',42:'SC',43:'RS',50:'MS',51:'MT',52:'GO',53:'DF'};
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const TP_EMIS = {1:'Normal',2:'Contingência FS-IA',3:'Regime especial',4:'Contingência EPEC',5:'Contingência FS-DA',6:'Contingência SVC-AN',7:'Contingência SVC-RS',9:'Contingência off-line NFC-e'};
function dvChave(k43){ let s = 0, w = 2; for (let i = k43.length - 1; i >= 0; i--){ s += +k43[i] * w; w = w < 9 ? w + 1 : 2; } const r = s % 11; return r < 2 ? 0 : 11 - r; }
function decodeChave(k){ k = digits(k); if (k.length !== 44) return null;
  return { chave:k, cUF:k.slice(0,2), uf:UF_COD[+k.slice(0,2)] || '??', ano:'20' + k.slice(2,4), mes:+k.slice(4,6), cnpj:k.slice(6,20), mod:k.slice(20,22),
    serie:+k.slice(22,25), numero:+k.slice(25,34), tpEmis:+k[34], cNF:k.slice(35,43), dv:+k[43], dvOk:dvChave(k.slice(0,43)) === +k[43] }; }
const fmtChave = k => digits(k).replace(/(\d{4})(?=\d)/g, '$1 ');

/* ---------- leitura do XML da NF-e ---------- */
/* Lê o XML completo (nfeProc ou NFe): emitente com endereço e IE, itens com NCM, CFOP, marca e impostos
   que entram no custo (frete, seguro, outras, IPI, ICMS-ST, menos desconto), totais e duplicatas (vencimentos). */
function lerNFe(texto, arquivo=''){
  const doc = new DOMParser().parseFromString(texto, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('O arquivo não é um XML válido.');
  const T = (el, t) => el ? (el.getElementsByTagNameNS('*', t)[0] || null) : null;
  const V = (el, t) => { const n = T(el, t); return n ? n.textContent.trim() : ''; };
  const N = (el, t) => parseFloat(V(el, t)) || 0;
  const inf = T(doc, 'infNFe');
  if (!inf) throw new Error(T(doc, 'resNFe') ? 'Este XML é só o resumo da nota (resNFe). Peça o XML completo ao fornecedor ou baixe pela chave de acesso.' : 'Não encontrei uma NF-e neste arquivo. Pode ser um evento, um CT-e ou outro documento.');
  const ide = T(inf,'ide'), emit = T(inf,'emit'), dest = T(inf,'dest'), ender = T(emit,'enderEmit'), tot = T(inf,'ICMSTot');
  const itens = [...inf.getElementsByTagNameNS('*','det')].map((det, i) => {
    const p = T(det,'prod'), imp = T(det,'imposto'); const icmsG = T(imp,'ICMS'); const icms = icmsG ? icmsG.firstElementChild : null;
    const infAd = V(det,'infAdProd'); const marca = ((infAd.match(/MARCA\s*[:\-]\s*([^;|\n]+)/i) || [])[1] || '').trim();
    const extras = N(p,'vFrete') + N(p,'vSeg') + N(p,'vOutro') - N(p,'vDesc') + (T(imp,'IPI') ? N(T(imp,'IPI'),'vIPI') : 0) + (icms ? N(icms,'vICMSST') : 0);
    return { n:+(det.getAttribute('nItem') || i + 1), cProd:V(p,'cProd'), ean:V(p,'cEAN'), xProd:V(p,'xProd'), ncm:V(p,'NCM'), cfop:V(p,'CFOP'),
      uCom:(V(p,'uCom') || 'UN').toUpperCase(), qCom:N(p,'qCom'), vUnCom:N(p,'vUnCom'), vProd:N(p,'vProd'), extras:r2(extras), vICMS:icms ? N(icms,'vICMS') : 0, marca };
  });
  if (!itens.length) throw new Error('A nota não tem itens.');
  const dups = [...inf.getElementsByTagNameNS('*','dup')].map(d => ({ n:V(d,'nDup'), venc:V(d,'dVenc'), valor:N(d,'vDup') }));
  const totais = { vProd:N(tot,'vProd'), vNF:N(tot,'vNF'), vICMS:N(tot,'vICMS'), vST:N(tot,'vST'), vFrete:N(tot,'vFrete'), vDesc:N(tot,'vDesc'), vIPI:N(tot,'vIPI') };
  if (!totais.vProd) totais.vProd = r2(itens.reduce((s,i) => s + i.vProd, 0));
  return { origem:'xml', arquivo, chave:digits(V(doc,'chNFe') || (inf.getAttribute('Id')||'').replace(/^NFe/,'')), numero:V(ide,'nNF'), serie:V(ide,'serie'), mod:V(ide,'mod') || '55',
    emissao:V(ide,'dhEmi') || V(ide,'dEmi'), natOp:V(ide,'natOp'), protocolo:V(doc,'nProt'),
    emit:{ cnpj:digits(V(emit,'CNPJ') || V(emit,'CPF')), razao:V(emit,'xNome'), fantasia:V(emit,'xFant'), ie:V(emit,'IE'), fone:digits(V(ender,'fone')), cidade:V(ender,'xMun'), uf:V(ender,'UF'),
      end:{ lgr:V(ender,'xLgr'), nro:V(ender,'nro'), bairro:V(ender,'xBairro'), cep:digits(V(ender,'CEP')) } },
    dest:{ doc:digits(V(dest,'CNPJ') || V(dest,'CPF')), nome:V(dest,'xNome') }, itens, totais, dups, infCpl:V(inf,'infCpl'),
    total:totais.vNF || totais.vProd };
}

function movimentar(E, p, tipo, qtd, custoUnit, extra={}){
  qtd = r3(qtd);
  if (p.valorEstoque === undefined) p.valorEstoque = r4(Math.max(p.estoque,0) * p.custoMedio);
  const cm = p.custoMedio, antes = p.estoque, novo = r3(p.estoque + qtd);
  const soma = tipo === 'entrada' || tipo === 'ajuste' || tipo === 'abertura';
  let dV;
  if (qtd > 0 && soma){ const cu = custoUnit ?? cm; dV = antes < 0 && novo > 0 ? novo*cu - p.valorEstoque : qtd*cu; if (tipo === 'entrada') p.ultimoCusto = cu; }
  else if (tipo === 'estorno') dV = qtd * (custoUnit || 0);
  else dV = qtd * cm;
  dV = r4(dV);
  p.estoque = novo; p.valorEstoque = r4(p.valorEstoque + dV);
  if (novo > 0 && p.valorEstoque > 0) p.custoMedio = p.valorEstoque / novo; else if (qtd > 0 && soma) p.custoMedio = custoUnit ?? cm;
  const m = { id:uid(), data:extra.data || new Date().toISOString(), tipo, produtoId:p.id, produtoNome:p.nome, codigo:p.codigo, unidade:p.unidade, qtd, custoUnit:custoUnit ?? cm, saldoAntes:antes, saldo:p.estoque, valor:dV, lancadoPor:extra.lancadoPor || nomeUsuario(), ...extra };
  E.movimentos.push(m); return m;
}

const U = () => D.usuarios.find(u => u.email === D.sessao?.email) || null;

const pode = acao => { const p = papel(); if (p === 'dono' || p === 'administrador') return true; if (p === 'operador') return acao !== 'empresa'; return false; };

/* ---------- quem recebeu ---------- */
function quem(E, dest){ if (!dest) return { nome:'Sem destino', etiqueta:'' }; if (dest.tipo === 'funcionario'){ const f = E.funcionarios.find(f => f.id === dest.id); return { nome:f?.nome || dest.nome || 'Funcionário', etiqueta:'Funcionário' }; } const d = E.destinos.find(d => d.id === dest.id); return { nome:d?.nome || dest.nome || 'Destino', etiqueta:'Destino' }; }

/* ---------- saída ---------- */
function registrarSaida(Em, { linhas, destino, data, lancadoPor, obs }){
  Em.seq.saida++;
  const op = { id:uid(), numero:'S-' + String(Em.seq.saida).padStart(5,'0'), data:data || new Date().toISOString(), destino, lancadoPor, obs, itens:[], estornada:null };
  for (const l of linhas){ const p = Em.produtos.find(x => x.id === l.produtoId); const m = movimentar(Em, p, 'saida', -Math.abs(l.qtd), null, { data:op.data, operacaoId:op.id, destino, lancadoPor, ref:op.numero }); op.itens.push({ produtoId:p.id, nome:p.nome, codigo:p.codigo, unidade:p.unidade, qtd:Math.abs(l.qtd), custoUnit:m.custoUnit, movId:m.id }); }
  Em.operacoes.push(op); return op;
}

  const saidas30 = Em.movimentos.filter(m => m.tipo === 'saida' && Date.parse(m.data) >= d30);
  const estornos30 = Em.movimentos.filter(m => m.tipo === 'estorno' && !m.notaId && Date.parse(m.data) >= d30);
  const consumo = saidas30.reduce((s,m) => s - m.valor, 0) - estornos30.reduce((s,m) => s + m.valor, 0);
  const entradas30 = Em.movimentos.filter(m => (m.tipo === 'entrada' || (m.tipo === 'estorno' && m.notaId)) && Date.parse(m.data) >= d30).reduce((s,m) => s + m.valor, 0);
  /* vencimentos das notas (boletos / duplicatas): vencidos há até 15 dias e os próximos */

  const venc = Em.notas.filter(n => n.status === 'lancada').flatMap(n => (n.dups||[]).map(d => ({ ...d, nota:n, dias:Math.round((new Date(d.venc + 'T12:00:00').getTime() - hoje0) / 86400000) }))).filter(d => d.venc && d.dias >= -15).sort((a,b) => a.venc.localeCompare(b.venc));
  const aRevisar = Em.produtos.filter(p => p.revisar).length;
  /* consumo por destino */
  const porDest = {};
  for (const op of Em.operacoes){ if (Date.parse(op.data) < d30 || op.estornada) continue; const q = quem(Em, op.destino); const k = q.etiqueta === 'Funcionário' ? 'Retiradas por funcionário' : q.nome; porDest[k] = (porDest[k] || 0) + op.itens.reduce((s,i) => s + i.qtd * i.custoUnit, 0); }
  const lista = Object.entries(porDest).sort((a,b) => b[1] - a[1]).slice(0,7); const max = lista[0]?.[1] || 1;
  /* saídas por dia */
  const dias = []; for (let i = 29; i >= 0; i--){ const d = new Date(Date.now() - i*86400000); const k = d.toDateString(); const v = saidas30.filter(m => new Date(m.data).toDateString() === k).reduce((s,m) => s - m.valor, 0); dias.push({ d, v }); }
  const maxD = Math.max(...dias.map(x => x.v), 1);

function movLinha(m){

  const rot = { entrada:'Entrada', abertura:'Saldo inicial', saida:'Saída', ajuste:'Ajuste', estorno:'Estorno' }[m.tipo];
  const det = m.tipo === 'saida' ? quem(Em, m.destino).nome : m.tipo === 'entrada' ? (m.ref || 'NF-e') : m.tipo === 'ajuste' ? (m.motivo || '') : m.tipo === 'estorno' ? (m.ref || '') : '';

}

/* ---------- estoque ---------- */
function vEstoque(){
  const Em = E(), f = S.filtros.est || (S.filtros.est = { q:'', g:'', s:'' });
  let ps = [...Em.produtos];
  if (f.q){ const q = norm(f.q); ps = ps.filter(p => norm(p.nome + ' ' + p.codigo + ' ' + p.ean + ' ' + (p.apelidos||[]).join(' ')).includes(q) || scoreDesc(f.q, p.nome) >= 60); }
  if (f.g) ps = ps.filter(p => p.grupoId === f.g);
  if (f.s === 'baixo') ps = ps.filter(p => p.minimo > 0 && p.estoque <= p.minimo);
  if (f.s === 'neg') ps = ps.filter(p => p.estoque < 0);
  if (f.s === 'rev') ps = ps.filter(p => p.revisar);
  ps.sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  const total = ps.reduce((s,p) => s + Math.max(p.estoque,0) * p.custoMedio, 0);
  return topo('Estoque', `${ps.length} itens · ${brl(total)} pelo custo médio`, pode('operar') ? `<button class="btn pri" data-act="novo-produto">${ic('mais')}Novo produto</button>` : '') +
  `<div class="conteudo"><div class="card"><div class="card-h"><div class="barra-filtros" style="width:100%">
      <input class="inp" id="est-q" placeholder="Buscar por nome, código ou EAN" value="${esc(f.q)}" data-filtro="est.q">
      <select class="inp" id="est-g" data-filtro="est.g"><option value="">Todos os grupos</option>${Em.grupos.map(g => `<option value="${g.id}" ${f.g === g.id ? 'selected' : ''}>${esc(g.nome)}</option>`).join('')}</select>
      <select class="inp" id="est-s" data-filtro="est.s"><option value="">Todos os saldos</option><option value="baixo" ${f.s === 'baixo' ? 'selected' : ''}>Abaixo do mínimo</option><option value="neg" ${f.s === 'neg' ? 'selected' : ''}>Saldo negativo</option><option value="rev" ${f.s === 'rev' ? 'selected' : ''}>A revisar (vindos da nota)</option></select>
    </div></div>
    ${ps.length ? `<div class="tabela-wrap"><table class="t"><thead><tr><th>Produto</th><th class="esconde-m">Grupo</th><th class="r">Saldo</th><th class="r esconde-m">Custo médio</th><th class="r esconde-m">Valor</th></tr></thead><tbody>
      ${ps.map(p => { const g = Em.grupos.find(g => g.id === p.grupoId); const st = (p.estoque < 0 ? '<span class="chip bad">Negativo</span>' : p.minimo > 0 && p.estoque <= p.minimo ? '<span class="chip warn">Repor</span>' : '') + (p.revisar ? ' <span class="chip azul">Revisar</span>' : ''); return `<tr class="clica" data-act="produto" data-id="${p.id}"><td><span class="nome">${esc(p.nome)}</span><small class="mono">${esc(p.codigo)}${p.ean ? ' · ' + esc(p.ean) : ''}</small></td><td class="esconde-m">${g ? `<span class="grupo-tag"><i style="background:${g.cor}"></i>${esc(g.nome)}</span>` : '<span class="muted">Sem grupo</span>'}</td><td class="r"><b>${nfmt(p.estoque)}</b> ${esc(p.unidade)} ${st}<small>mín. ${nfmt(p.minimo)}</small></td><td class="r esconde-m">${brl(p.custoMedio)}</td><td class="r esconde-m">${brl(Math.max(p.estoque,0)*p.custoMedio)}</td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="vazio">${ic('busca')}Nenhum produto encontrado com esses filtros.</div>`}
  </div></div>`;
}

/* ---------- saída ---------- */
function novaSaida(prodId){ S.sai = { linhas: prodId ? [{ produtoId:prodId, qtd:1 }] : [], destino:'', data:hojeISO(), lancadoPor:nomeUsuario(), obs:'', passo:'form', erro:'' }; }
function vSaida(){
  if (!pode('operar')) return topo('Saída de material') + `<div class="conteudo">${somenteLeitura()}</div>`;
  if (!S.sai) novaSaida();
  const Em = E(), s = S.sai;
  const opDest = `<option value="">Escolha quem recebe</option><optgroup label="Destinos">${Em.destinos.map(d => `<option value="destino:${d.id}" ${s.destino === 'destino:' + d.id ? 'selected' : ''}>${esc(d.nome)}</option>`).join('')}</optgroup><optgroup label="Funcionários">${Em.funcionarios.map(f => `<option value="funcionario:${f.id}" ${s.destino === 'funcionario:' + f.id ? 'selected' : ''}>${esc(f.nome)} (${esc(f.funcao)})</option>`).join('')}</optgroup>`;
  const passos = `<div class="passos"><span class="${s.passo === 'form' ? 'on' : ''}"><b>1</b>Itens e destino</span><i></i><span class="${s.passo === 'revisao' ? 'on' : ''}"><b>2</b>Revisão</span><i></i><span><b>3</b>Comprovante</span></div>`;
  const tot = s.linhas.reduce((t,l) => { const p = Em.produtos.find(x => x.id === l.produtoId); return t + (Number(l.qtd)||0) * (p?.custoMedio || 0); }, 0);
  if (s.passo === 'revisao'){
    const q = quem(Em, destinoDe(s.destino));
    return topo('Revisar saída', 'Confira antes de confirmar. Depois de confirmada, só dá para estornar.') + `<div class="conteudo">${passos}
      <div class="card"><div class="card-h"><h2>${esc(q.nome)}</h2><span class="chip azul">${esc(q.etiqueta)}</span><span class="muted">${fmtData(s.data)} · lançado por ${esc(s.lancadoPor)}</span></div>
      <div class="tabela-wrap"><table class="t"><thead><tr><th>Produto</th><th class="r">Quantidade</th><th class="r">Saldo depois</th><th class="r esconde-m">Valor</th></tr></thead><tbody>
      ${s.linhas.map(l => { const p = Em.produtos.find(x => x.id === l.produtoId); const dep = p.estoque - l.qtd; return `<tr><td><span class="nome">${esc(p.nome)}</span><small class="mono">${esc(p.codigo)}</small></td><td class="r"><b>${nfmt(l.qtd)}</b> ${esc(p.unidade)}</td><td class="r">${nfmt(dep)} ${dep < 0 ? '<span class="chip bad">Negativo</span>' : ''}</td><td class="r esconde-m">${brl(l.qtd * p.custoMedio)}</td></tr>`; }).join('')}
      </tbody></table></div><div class="card-b" style="display:flex;justify-content:space-between;border-top:1px solid var(--line-2)"><span class="muted">${s.linhas.length} ${s.linhas.length === 1 ? 'item' : 'itens'}${s.obs ? ' · ' + esc(s.obs) : ''}</span><b>${brl(tot)}</b></div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" data-act="sai-voltar">Voltar e corrigir</button><button class="btn pri" data-act="sai-confirmar">${ic('ok')}Confirmar saída</button></div></div>`;
  }
  return topo('Saída de material', 'Monte a lista do que está saindo e para quem.') + `<div class="conteudo">${passos}
    <div class="grid g-painel">
      <div class="card"><div class="card-h"><h2>Itens</h2><span class="muted">${s.linhas.length} na lista</span></div><div class="card-b" style="display:grid;gap:14px">

        ${s.linhas.length ? `<div class="tabela-wrap"><table class="t"><thead><tr><th>Produto</th><th class="r">Saldo</th><th class="r" style="width:120px">Quantidade</th><th></th></tr></thead><tbody>
          ${s.linhas.map((l,i) => { const p = Em.produtos.find(x => x.id === l.produtoId); return `<tr><td><span class="nome">${esc(p.nome)}</span><small class="mono">${esc(p.codigo)}</small></td><td class="r">${nfmt(p.estoque)} ${esc(p.unidade)}</td><td class="r"><input class="inp num" id="sai-q-${i}" type="number" min="0" step="any" value="${l.qtd}" data-sai-qtd="${i}" aria-label="Quantidade de ${esc(p.nome)}"></td><td class="r"><button class="btn ghost sm" data-act="sai-tirar" data-i="${i}" aria-label="Tirar da lista">${ic('lixo')}</button></td></tr>`; }).join('')}
        </tbody></table></div>` : `<div class="vazio">${ic('estoque')}Busque um produto acima para começar a lista.</div>`}
      </div></div>
      <div class="card" style="align-self:start"><div class="card-h"><h2>Para quem</h2></div><div class="card-b"><div class="form">
        <div class="campo s12"><label for="sai-dest">Responsável pela retirada / Destino</label><select class="inp" id="sai-dest" data-sai="destino">${opDest}</select></div>

        <div class="campo s6"><label for="sai-quem">Lançado por</label><input class="inp" id="sai-quem" value="${esc(s.lancadoPor)}" data-sai="lancadoPor"></div>
        <div class="campo s12"><label for="sai-obs">Observação</label><input class="inp" id="sai-obs" value="${esc(s.obs)}" data-sai="obs" placeholder="Opcional"></div>

        <div class="s12" style="display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line-2);padding-top:12px"><span class="muted">Total pelo custo médio</span><b style="font-size:16px">${brl(tot)}</b></div>
        <button class="btn pri s12" data-act="sai-revisar">Revisar saída ${ic('seta')}</button>
      </div></div></div>
    </div></div>`;
}
const destinoDe = v => { if (!v) return null; const [tipo, id] = v.split(':'); return { tipo, id }; };
function comprovanteSaida(opId){

/* =========================================================================
   Entrada de NF-e (etapa 1, trazida do Almox)
   Importar (XML, vários arquivos, chave de acesso, digitação do DANFE) → conferir → entrada registrada.
   ========================================================================= */
const normUn = u => ({ UND:'UN', UNID:'UN', UNIDADE:'UN', UNI:'UN', U:'UN', PECA:'PC', PECAS:'PC', PCS:'PC', CAIXA:'CX', PACOTE:'PCT', LT:'L', LITRO:'L', LITROS:'L', MT:'M', METRO:'M', ROLO:'RL', GALAO:'GL', FARDO:'FD', DUZIA:'DZ', JOGO:'JG' })[norm(u).replace(/\s/g,'')] || norm(u).replace(/\s/g,'') || 'UN';
const notaLancada = (Em, chave) => chave ? Em.notas.find(n => n.chave === chave && n.status === 'lancada') : null;
const nomeForn = f => f ? (f.fantasia || f.razao || 'Fornecedor') : 'Fornecedor';
function grupoPorNCM(Em, ncm){ ncm = digits(ncm); if (!ncm) return ''; const mapa = Em.ncmGrupo || {}; const g = mapa[ncm] || mapa[ncm.slice(0,4)]; return g && Em.grupos.some(x => x.id === g) ? g : ''; }
function aprenderNCM(Em, ncm, grupoId){ ncm = digits(ncm); if (ncm.length < 4 || !grupoId) return; Em.ncmGrupo = Em.ncmGrupo || {}; Em.ncmGrupo[ncm] = grupoId; if (!Em.ncmGrupo[ncm.slice(0,4)]) Em.ncmGrupo[ncm.slice(0,4)] = grupoId; }
function fatorPara(Em, it, p, fornId){
  const v = (p.vinculos||[]).find(v => v.fornecedorId === fornId && it.cProd && v.cProd === it.cProd); if (v) return { fator:v.fator || 1, auto:false };
  if (normUn(it.uCom) === p.unidade) return { fator:1, auto:false };
  const d = fatorDaDescricao(it.xProd); return d ? { fator:d, auto:true } : { fator:1, auto:false };
}
const passosEntrada = n => `<div class="passos">${['Importar a nota','Conferir os itens','Entrada registrada'].map((t,i) => `${i ? '<i></i>' : ''}<span class="${n === i+1 ? 'on' : ''}"><b>${i+1}</b>${t}</span>`).join('')}</div>`;

function prepararEntrada(nf, fila){
  const Em = E(); const forn = Em.fornecedores.find(f => digits(f.cnpj) === nf.emit.cnpj);
  const itens = nf.itens.map(it => {
    const m = reconhecer(Em, it, forn?.id), ok = certo(m), p = ok ? Em.produtos.find(x => x.id === m.produtoId) : null;
    const desc = fatorDaDescricao(it.xProd);
    let fator = 1, fatorAuto = false, fatorAviso = '';
    if (p){ if (m.lembrada && m.fator) fator = m.fator; else { const f = fatorPara(Em, it, p, forn?.id); fator = f.fator; fatorAuto = f.auto; } }
    else if (desc){ fator = desc; fatorAuto = true; }
    if (!m.lembrada && !fatorAuto && fator === 1 && !['UN','PAR'].includes(normUn(it.uCom)) && !(p && p.unidade === normUn(it.uCom))) fatorAviso = `Confira quantas unidades vêm em 1 ${it.uCom}.`;
    const g = grupoPorNCM(Em, it.ncm);
    return { incluir:true, produtoId:p ? p.id : null, origem:m.tipo, m, fator, fatorAuto, fatorAviso, nome:titulo(it.xProd), nomeEditado:false, grupoId:g, grupoHerdado:!!g, unidade:desc ? 'UN' : normUn(it.uCom) };
  });
  S.ent = { passo:'conf', nf, itens, lancadoPor:S.ultimoLancador || nomeUsuario(), fila:fila?.fila || [], qIdx:fila?.qIdx || 1, qTotal:fila?.qTotal || 1, resultado:null };
  if (Em.config?.autoLancar && entradaAutoOk()) return confirmarEntrada(true);
  S.rota = 'entrada';
}
function entradaAutoOk(){
  const Em = E(), e = S.ent, nf = e.nf;
  const destOk = !digits(Em.cnpj) || !nf.dest?.doc || digits(Em.cnpj) === nf.dest.doc;
  const k = nf.chave ? decodeChave(nf.chave) : null;
  return nf.origem === 'xml' && !notaLancada(Em, nf.chave) && destOk && (!k || k.dvOk) && e.itens.every((r, i) => r.produtoId && certo(r.m) && !r.fatorAviso && r.fator > 0 && nf.itens[i].qCom > 0);
}
const tipoLinha = r => r.produtoId ? (r.origem === 'manual' ? 'manual' : 'ok') : (r.m?.tipo === 'sugestao' ? 'sugestao' : 'novo');
function statsEntrada(){
  const e = S.ent, inc = e.itens.filter(r => r.incluir);
  const novos = inc.filter(r => !r.produtoId).length, sug = inc.filter(r => tipoLinha(r) === 'sugestao').length;
  const valor = e.itens.reduce((s, r, i) => s + (r.incluir ? e.nf.itens[i].vProd + e.nf.itens[i].extras : 0), 0);
  return { total:e.itens.length, inc:inc.length, novos, sug, vinc:inc.length - novos, valor };
}

  return topo('Entrada de NF-e', 'Importe o XML ou use a chave de acesso. O SCAE reconhece os itens, converte as embalagens e calcula o custo médio.', Em.config?.autoLancar ? `<span class="chip azul">${ic('ok')}Entrada automática ligada</span>` : '') + `<div class="conteudo">

const numBR = s => { s = String(s ?? '').trim(); if (!s) return 0; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); return parseFloat(s) || 0; };
function manualParaNota(){
  const M = S.manual, k = M.k;
  const itens = M.linhas.map(l => ({ x:l.x.trim(), u:l.u, q:numBR(l.q), v:numBR(l.v) })).filter(l => l.x && l.q > 0)
    .map((l, i) => ({ n:i+1, cProd:'', ean:'', xProd:l.x, ncm:'', cfop:'', uCom:l.u, qCom:l.q, vUnCom:l.v, vProd:r2(l.q * l.v), extras:0, vICMS:0, marca:'' }));

  const razao = M.forn ? M.forn.razao : M.razao.trim();

/* Estorno da entrada: só se todo o material ainda estiver no estoque. Nada é apagado. */
function estornarNota(id){
  const Em = E(), n = Em.notas.find(x => x.id === id); if (!n || n.status !== 'lancada') return;
  const falta = n.itens.map(i => ({ i, p:Em.produtos.find(x => x.id === i.produtoId) })).filter(({i, p}) => p && p.estoque < i.qtdEstoque - 1e-9);
  if (falta.length) return abrirJanela(`<div class="janela"><div class="janela-h"><h2>Não é possível estornar</h2><button class="btn ghost sm x" data-act="fechar" aria-label="Fechar">${ic('x')}</button></div><div class="janela-b"><div class="alerta bad">${ic('alerta')}<div><b>Parte do material já saiu do estoque</b>${falta.map(({i, p}) => `${esc(p.nome)}: entrou ${nfmt(i.qtdEstoque)}, saldo atual ${nfmt(p.estoque)}`).join('<br>')}</div></div><div class="muted" style="font-size:13px">Estorne as saídas ou registre um ajuste de saldo antes de estornar a nota.</div></div><div class="janela-p"><button class="btn pri" data-act="fechar">Entendi</button></div></div>`);
  confirmar(`Estornar a NF ${n.numero}`, `Os ${n.itens.length} itens saem do estoque pelo mesmo custo da entrada e a nota fica marcada como estornada. Nada é apagado e a nota pode ser lançada de novo depois.`, f => {
    for (const i of n.itens){ const p = Em.produtos.find(x => x.id === i.produtoId); if (p) movimentar(Em, p, 'estorno', -i.qtdEstoque, i.custoUnit, { notaId:n.id, ref:'Estorno NF ' + n.numero, motivo:f.motivo }); }
    n.status = 'estornada'; n.estorno = { em:new Date().toISOString(), por:nomeUsuario(), motivo:f.motivo };
    salvar(); render(); janelaNota(n.id); toast('Entrada estornada.');
  }, { motivo:true, botao:'Estornar entrada', perigo:true });
}

/* ---------- histórico ---------- */
function vHistorico(){
  const Em = E(), f = S.filtros.his || (S.filtros.his = { tipo:'', per:'30', q:'' });
  let ms = [...Em.movimentos];
  if (f.tipo) ms = ms.filter(m => m.tipo === f.tipo);
  if (f.per) ms = ms.filter(m => Date.parse(m.data) >= Date.now() - (+f.per)*86400000);
  if (f.q){ const q = norm(f.q); ms = ms.filter(m => norm(m.produtoNome + ' ' + (m.lancadoPor||'') + ' ' + (m.ref||'') + ' ' + (m.destino ? quem(Em, m.destino).nome : '')).includes(q)); }
  ms.sort((a,b) => b.data.localeCompare(a.data));
  const grupos = []; const vistos = new Map();
  for (const m of ms){ const k = m.operacaoId || m.notaId || m.id; if (!vistos.has(k)){ vistos.set(k, { k, ms:[] }); grupos.push(vistos.get(k)); } vistos.get(k).ms.push(m); }
  return topo('Histórico', `${grupos.length} lançamentos no período`) + `<div class="conteudo"><div class="card"><div class="card-h"><div class="barra-filtros" style="width:100%">
      <input class="inp" id="his-q" placeholder="Buscar produto, pessoa, destino ou número" value="${esc(f.q)}" data-filtro="his.q">
      <select class="inp" id="his-t" data-filtro="his.tipo"><option value="">Todos os tipos</option>${[['saida','Saídas'],['entrada','Entradas'],['ajuste','Ajustes'],['estorno','Estornos'],['abertura','Saldo inicial']].map(([v,t]) => `<option value="${v}" ${f.tipo === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select class="inp" id="his-p" data-filtro="his.per">${[['1','Hoje'],['7','7 dias'],['30','30 dias'],['','Tudo']].map(([v,t]) => `<option value="${v}" ${f.per === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div></div>
    ${grupos.length ? grupos.slice(0,120).map(g => { const m = g.ms[0]; if (g.ms.length === 1) return movLinha(m);
      const op = Em.operacoes.find(o => o.id === m.operacaoId); const nota = Em.notas.find(n => n.id === m.notaId);
      const t = op ? `Saída ${op.numero} · ${quem(Em, op.destino).nome}` : nota ? `Entrada NF ${nota.numero}` : 'Lançamento';
      const cls = op ? 'sai' : 'ent', icn = op ? 'saida' : 'entrada';
      return `<div class="mov" data-act="${op ? 'operacao' : 'nota'}" data-id="${op ? op.id : nota.id}"><span class="ic ${cls}">${ic(icn)}</span><div class="tx"><b>${esc(t)}</b><small>${g.ms.length} itens · ${esc(m.lancadoPor || '')}${op?.estornada ? ' · estornada' : ''}</small></div><div class="vl">${brl(Math.abs(g.ms.reduce((s,x) => s + x.valor, 0)))}<small>${fmtDataHora(m.data)}</small></div></div>`; }).join('') : `<div class="vazio">${ic('historico')}Nada no período escolhido.</div>`}
  </div></div>`;
}

/* ---------- cotações ---------- */
const ST_COT = { rascunho:['Rascunho',''], em_cotacao:['Em cotação','azul'], aprovada:['Aprovada','ok'], comprada:['Comprada','ok'], cancelada:['Cancelada','bad'] };
function calcCot(c){
  const tot = c.propostas.map(p => { let soma = 0, faltam = 0; for (const it of c.itens){ const v = p.precos[it.id]; if (v > 0) soma += v * it.qtd; else faltam++; } return { p, soma:r2(soma), total:r2(soma + (+p.frete || 0)), faltam }; });
  const menor = {}; for (const it of c.itens){ let m = null; for (const p of c.propostas){ const v = p.precos[it.id]; if (v > 0 && (m === null || v < m.v)) m = { v, pid:p.id }; } menor[it.id] = m; }
  const completas = tot.filter(t => !t.faltam).sort((a,b) => a.total - b.total);
  const dividida = r2(c.itens.reduce((s,it) => s + (menor[it.id] ? menor[it.id].v * it.qtd : 0), 0));
  return { tot, menor, melhor:completas[0] || null, dividida, economia: completas[0] ? r2(completas[0].soma - dividida) : 0 };
}
function vCotacoes(){

function buscaSaida(q){
  const box = $('#sai-res'); if (!box) return;
  if (!q.trim()) { box.hidden = true; return; }
  const Em = E(), nq = norm(q);
  const res = Em.produtos.map(p => ({ p, n: norm(p.nome + ' ' + p.codigo + ' ' + p.ean).includes(nq) ? 100 : scoreDesc(q, p.nome) })).filter(x => x.n >= 50).sort((a,b) => b.n - a.n).slice(0,7);
  box.innerHTML = res.length ? res.map(({p}) => `<button type="button" data-act="sai-add" data-id="${p.id}"><div><b>${esc(p.nome)}</b><small class="mono">${esc(p.codigo)}</small></div><small>${nfmt(p.estoque)} ${esc(p.unidade)}</small></button>`).join('') : '<div class="vazio" style="padding:14px">Nenhum produto com esse nome.</div>';
  box.hidden = false;
}

function lerLogo(arq){
  if (arq.size > 5*1024*1024) return toast('A imagem tem mais de 5 MB. Escolha uma menor.');
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
      const max = 600, esc_ = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * esc_)); c.height = Math.max(1, Math.round(img.height * esc_));
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
